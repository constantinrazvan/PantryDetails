<div class="min-vh-100 d-flex align-items-center bg-body-tertiary py-4">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-12 col-sm-9 col-md-6 col-lg-4">
        <div class="card shadow-sm">
          <div class="card-body p-4">
            <div class="text-center mb-4">
              <i class="bi bi-safe fs-1 text-primary"></i>
              <h1 class="h4 mt-2 mb-1">PantryDetails</h1>
              <p class="text-body-secondary small mb-0">Sign in to see your vaults</p>
            </div>

            @if (error) {
              <div class="alert alert-danger py-2 small" role="alert">{{ error }}</div>
            }

            <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
              <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input
                  id="email"
                  type="email"
                  class="form-control"
                  [class.is-invalid]="invalid('email')"
                  formControlName="email"
                  autocomplete="email"
                  autofocus
                />
                <div class="invalid-feedback">Enter a valid email.</div>
              </div>

              <div class="mb-2">
                <label for="password" class="form-label">Password</label>
                <div class="input-group has-validation">
                  <input
                    id="password"
                    class="form-control"
                    [type]="showPassword ? 'text' : 'password'"
                    [class.is-invalid]="invalid('password')"
                    formControlName="password"
                    autocomplete="current-password"
                  />
                  <button
                    type="button"
                    class="btn btn-outline-primary"
                    (click)="showPassword = !showPassword"
                    [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'"
                  >
                    <i class="bi" [class.bi-eye]="!showPassword" [class.bi-eye-slash]="showPassword"></i>
                  </button>
                  <div class="invalid-feedback">Enter your password.</div>
                </div>
              </div>

              <div class="text-end mb-4">
                <a routerLink="/forgot-password" class="small">Forgot your password?</a>
              </div>

              <button type="submit" class="btn btn-primary w-100" [disabled]="submitting">
                @if (submitting) {
                  <span class="spinner-border spinner-border-sm me-2" aria-hidden="true"></span>
                }
                Sign in
              </button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
