<div class="min-vh-100 d-flex align-items-center bg-body-tertiary py-4">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-12 col-sm-9 col-md-6 col-lg-4">
        <div class="card shadow-sm">
          <div class="card-body p-4">
            <div class="text-center mb-4">
              <i class="bi bi-shield-lock fs-1 text-primary"></i>
              <h1 class="h4 mt-2 mb-1">Choose a new password</h1>
              <p class="text-body-secondary small mb-0">
                You signed in with the password from your email. Before you continue, choose your own.
              </p>
            </div>

            @if (error) {
              <div class="alert alert-danger py-2 small" role="alert">{{ error }}</div>
            }

            <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
              <div class="mb-3">
                <label for="oldPassword" class="form-label">Password from email</label>
                <input
                  id="oldPassword"
                  class="form-control"
                  formControlName="oldPassword"
                  autocomplete="current-password"
                  [type]="showPasswords ? 'text' : 'password'"
                  [class.is-invalid]="invalid('oldPassword')"
                  autofocus
                />
                <div class="invalid-feedback">Enter the password from the email.</div>
              </div>

              <div class="mb-3">
                <label for="newPassword" class="form-label">New password</label>
                <input
                  id="newPassword"
                  class="form-control"
                  formControlName="newPassword"
                  autocomplete="new-password"
                  [type]="showPasswords ? 'text' : 'password'"
                  [class.is-invalid]="invalid('newPassword')"
                />
                <div class="invalid-feedback">At least 8 characters.</div>
              </div>

              <div class="mb-2">
                <label for="confirmPassword" class="form-label">Confirm new password</label>
                <input
                  id="confirmPassword"
                  class="form-control"
                  formControlName="confirmPassword"
                  autocomplete="new-password"
                  [type]="showPasswords ? 'text' : 'password'"
                  [class.is-invalid]="invalid('confirmPassword') || mismatch()"
                />
                <div class="invalid-feedback">{{ mismatch() ? 'Passwords do not match.' : 'Confirm the new password.' }}</div>
              </div>

              <div class="form-check mb-4">
                <input
                  id="showPasswords"
                  type="checkbox"
                  class="form-check-input"
                  [checked]="showPasswords"
                  (change)="showPasswords = !showPasswords"
                />
                <label for="showPasswords" class="form-check-label small">Show passwords</label>
              </div>

              <button type="submit" class="btn btn-primary w-100 mb-2" [disabled]="saving">
                @if (saving) {
                  <span class="spinner-border spinner-border-sm me-2" aria-hidden="true"></span>
                }
                Save and continue
              </button>
              <button type="button" class="btn btn-link w-100" (click)="auth.logout()">Sign out</button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
