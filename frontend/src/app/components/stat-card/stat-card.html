<div class="card shadow-sm h-100">
  <div class="card-body d-flex align-items-center gap-3">
    <span [class]="'stat-icon rounded d-flex align-items-center justify-content-center fs-4 flex-shrink-0 text-white bg-' + color">
      <i [class]="'bi ' + icon"></i>
    </span>
    <div class="overflow-hidden">
      <div class="fs-4 fw-semibold lh-1">{{ value }}</div>
      @if (link) {
        <a [routerLink]="link" class="small text-body-secondary stretched-link text-decoration-none">{{ label }}</a>
      } @else {
        <div class="small text-body-secondary">{{ label }}</div>
      }
    </div>
  </div>
</div>
