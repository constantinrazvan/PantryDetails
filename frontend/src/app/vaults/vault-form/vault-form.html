<div class="p-3 p-md-4">
  <a
    [routerLink]="isEdit ? ['/dashboard/vaults', id] : ['/dashboard/vaults']"
    class="d-inline-flex align-items-center gap-1 mb-3 text-decoration-none"
  >
    <i class="bi bi-chevron-left"></i> Back
  </a>

  <div class="row">
    <div class="col-12 col-lg-8 col-xl-6">
      <h1 class="h3 mb-4">{{ isEdit ? 'Edit vault' : 'New vault' }}</h1>

      @if (error) {
        <div class="alert alert-danger py-2">{{ error }}</div>
      }

      @if (loading) {
        <p class="text-body-secondary">Loading…</p>
      } @else {
        <form [formGroup]="form" (ngSubmit)="submit()" novalidate class="card card-body">
          <div class="mb-3">
            <label for="name" class="form-label">Name</label>
            <input
              id="name"
              class="form-control"
              formControlName="name"
              maxlength="150"
              [class.is-invalid]="invalid('name')"
              autofocus
            />
            <div class="invalid-feedback">Name is required (max 150 characters).</div>
          </div>

          <div class="mb-4">
            <label for="description" class="form-label">
              Description <span class="text-body-secondary small">(optional)</span>
            </label>
            <textarea id="description" class="form-control" rows="3" formControlName="description"></textarea>
          </div>

          <div class="d-flex gap-2 justify-content-end">
            <a
              [routerLink]="isEdit ? ['/dashboard/vaults', id] : ['/dashboard/vaults']"
              class="btn btn-outline-primary"
            >
              Cancel
            </a>
            <button type="submit" class="btn btn-primary" [disabled]="saving">
              @if (saving) {
                <span class="spinner-border spinner-border-sm me-1" aria-hidden="true"></span>
              }
              {{ isEdit ? 'Save' : 'Create' }}
            </button>
          </div>
        </form>
      }
    </div>
  </div>
</div>
